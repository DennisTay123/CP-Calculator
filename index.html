<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CP Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f9f9f9;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 2rem;
    }

    .container {
      max-width: 960px;
      margin: auto;
    }

    .category {
      margin-bottom: 2rem;
      background: #fff;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
      transition: box-shadow 0.3s;
    }

    .category:hover {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }

    .category h2 {
      font-size: 1.3rem;
      color: #34495e;
      margin-bottom: 1rem;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 0.5rem;
      text-align: center;
    }

    th {
      background-color: #3498db;
      color: #fff;
    }

    td input, td select {
      width: 100%;
      padding: 0.3rem;
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    .valueCell {
      font-weight: bold;
      color: #2c3e50;
    }

    .best {
      background-color: #dff0d8 !important;
    }

    .button-bar {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    button {
      padding: 0.5rem 1rem;
      font-size: 0.95rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn-add-product {
      background-color: #27ae60;
      color: #fff;
    }

    .btn-add-product:hover {
      background-color: #1e8449;
    }

    .btn-remove {
      background-color: #e74c3c;
      color: #fff;
    }

    .btn-remove:hover {
      background-color: #c0392b;
    }

    .btn-add-category {
      background-color: #2980b9;
      color: #fff;
      display: block;
      width: 100%;
      max-width: 250px;
      margin: 2rem auto 0;
      text-align: center;
    }

    .btn-add-category:hover {
      background-color: #1c6692;
    }

    @media (max-width: 600px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead tr {
        display: none;
      }

      tr {
        margin-bottom: 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 0.5rem;
      }

      td {
        display: flex;
        justify-content: space-between;
        padding: 0.4rem;
      }

      td::before {
        content: attr(data-label);
        font-weight: bold;
        margin-right: 1rem;
      }

      td input, td select {
        width: 60%;
      }

      td:last-child {
        justify-content: flex-end;
      }

      td:last-child::before {
        content: '';
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CP Calculator (性价比)</h1>
    <div id="categoriesContainer"></div>
    <button class="btn-add-category" onclick="addCategory()">Add Category</button>
  </div>

  <script>
    let categoryCount = 0;

    function addCategory() {
      categoryCount++;
      const container = document.getElementById("categoriesContainer");

      const section = document.createElement("div");
      section.className = "category";
      section.id = `category-${categoryCount}`;
      section.innerHTML = `
        <h2>Category ${categoryCount}</h2>
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Unit</th>
              <th>Unit Type</th>
              <th>Value (Price/Unit)</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="button-bar">
          <button class="btn-add-product" onclick="addRow(this)">Add Product</button>
        </div>
      `;

      container.appendChild(section);
      addRow(section.querySelector(".btn-add-product"));
    }

    function addRow(button) {
      const tbody = button.closest(".category").querySelector("tbody");

      const row = document.createElement("tr");
      row.setAttribute("draggable", true);
      row.innerHTML = `
        <td data-label="Product"><input type="text" placeholder="e.g. Apple" /></td>
        <td data-label="Price"><input type="number" min="0" step="0.01" /></td>
        <td data-label="Unit"><input type="number" min="0.01" step="0.01" /></td>
        <td data-label="Unit Type">
          <select>
            <option value="pcs">pcs</option>
            <option value="g">g</option>
            <option value="kg">kg</option>
            <option value="ml">ml</option>
            <option value="l">l</option>
            <option value="other">other</option>
          </select>
        </td>
        <td data-label="Value" class="valueCell">-</td>
        <td><button class="btn-remove" onclick="removeRow(this)">Remove</button></td>
      `;

      tbody.appendChild(row);
      row.scrollIntoView({ behavior: "smooth", block: "center" });

      row.querySelectorAll("input, select").forEach(el => {
        el.addEventListener("input", () => updateValues(tbody));
      });

      enableDrag(tbody);
      updateValues(tbody);
    }

    function removeRow(button) {
      const row = button.closest("tr");
      const tbody = row.parentElement;
      row.remove();
      updateValues(tbody);
    }

    function updateValues(tbody) {
      const rows = tbody.querySelectorAll("tr");
      let minValue = Infinity;
      let bestRow = null;

      rows.forEach(row => {
        const price = parseFloat(row.cells[1].querySelector("input").value);
        const unit = parseFloat(row.cells[2].querySelector("input").value);
        const unitType = row.cells[3].querySelector("select").value;
        const valueCell = row.querySelector(".valueCell");

        let valueText = "-";
        if (!isNaN(price) && !isNaN(unit) && unit > 0) {
          const value = price / unit;
          valueText = `${value.toFixed(4)} / ${unitType}`;
          if (value < minValue) {
            minValue = value;
            bestRow = row;
          }
        }

        valueCell.textContent = valueText;
        row.classList.remove("best");
      });

      if (bestRow) bestRow.classList.add("best");
    }

    function enableDrag(tbody) {
      let draggingRow = null;

      tbody.querySelectorAll("tr").forEach(row => {
        row.ondragstart = (e) => {
          draggingRow = row;
          e.dataTransfer.effectAllowed = "move";
        };

        row.ondragover = (e) => {
          e.preventDefault();
          const target = e.target.closest("tr");
          if (target && target !== draggingRow && target.parentElement === draggingRow.parentElement) {
            const bounding = target.getBoundingClientRect();
            const offset = bounding.y + bounding.height / 2;
            if (e.clientY > offset) {
              target.after(draggingRow);
            } else {
              target.before(draggingRow);
            }
          }
        };

        row.ondragend = () => {
          updateValues(tbody);
        };
      });
    }

    // Auto-load the first category
    addCategory();
  </script>
</body>
</html>
