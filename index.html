<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CP Calculator (性价比)</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f9f9f9;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    .container {
      max-width: 960px;
      margin: auto;
    }

    .category-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin: 1rem 0;
      padding: 1rem;
      overflow: hidden;
    }

    .category-card h2 {
      margin-top: 0;
      color: #444;
      font-size: 1.25rem;
      cursor: pointer;
    }

    .category-card table {
      width: 100%;
      border-collapse: collapse;
      display: none;
    }

    .category-card.open table {
      display: table;
    }

    th, td {
      padding: 0.6rem;
      text-align: center;
      border: 1px solid #ddd;
    }

    th {
      background: #007bff;
      color: white;
    }

    td input, td select {
      width: 100%;
      padding: 0.3rem;
      font-size: 1rem;
    }

    .valueCell {
      font-weight: bold;
    }

    .best {
      background-color: #d4edda !important;
    }

    .button-bar {
      margin-top: 1rem;
      text-align: center;
    }

    .button-bar button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      margin: 0.3rem;
      cursor: pointer;
    }

    .add-category {
      background-color: #28a745;
      color: white;
    }

    .add-product {
      background-color: #17a2b8;
      color: white;
    }

    .remove-product {
      background-color: #dc3545;
      color: white;
    }

    @media (max-width: 600px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead tr { display: none; }

      tr {
        background: #fff;
        margin-bottom: 1rem;
        padding: 0.5rem;
        border-radius: 8px;
      }

      td {
        display: flex;
        justify-content: space-between;
        padding: 0.4rem;
        border: none;
        border-bottom: 1px solid #eee;
      }

      td::before {
        content: attr(data-label);
        font-weight: bold;
        flex: 1;
      }

      td input, td select {
        width: 60%;
      }

      td:last-child {
        justify-content: flex-end;
      }
    }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #333;
        color: #ddd;
      }

      .category-card {
        background: #444;
      }

      th {
        background: #0056b3;
      }

      .add-category, .add-product, .remove-product {
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CP Calculator (性价比)</h1>
    <div class="button-bar">
      <button class="add-category" onclick="addCategory()">Add Category</button>
    </div>
    <div id="categoriesContainer"></div>
  </div>

  <script>
    let categoryCount = 0;

    function addCategory() {
      categoryCount++;
      const container = document.getElementById("categoriesContainer");

      const card = document.createElement("div");
      card.className = "category-card";
      card.id = `category-${categoryCount}`;
      card.innerHTML = `
        <h2 onclick="toggleCategory(${categoryCount})">Category ${categoryCount}</h2>
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Unit</th>
              <th>Unit Type</th>
              <th>Value</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="button-bar">
          <button class="add-product" onclick="addRow(this)">Add Product</button>
        </div>
      `;

      container.appendChild(card);
      addRow(card.querySelector(".add-product"));
    }

    function toggleCategory(id) {
      const card = document.getElementById(`category-${id}`);
      card.classList.toggle("open");
    }

    function addRow(button) {
      const tbody = button.closest(".category-card").querySelector("tbody");
      const row = document.createElement("tr");

      row.innerHTML = `
        <td data-label="Product"><input type="text" placeholder="Product name" /></td>
        <td data-label="Price"><input type="number" step="0.01" min="0" /></td>
        <td data-label="Unit"><input type="number" step="0.01" min="0.01" /></td>
        <td data-label="Unit Type">
          <select>
            <option value="pcs">pcs</option>
            <option value="g">g</option>
            <option value="kg">kg</option>
            <option value="ml">ml</option>
            <option value="l">l</option>
            <option value="other">other</option>
          </select>
        </td>
        <td data-label="Value" class="valueCell">-</td>
        <td><button class="remove-product" onclick="removeRow(this)">Remove</button></td>
      `;

      tbody.appendChild(row);
      row.scrollIntoView({ behavior: "smooth", block: "center" });

      row.querySelectorAll("input, select").forEach(el => {
        el.addEventListener("input", () => updateValues(tbody));
      });

      updateValues(tbody);
    }

    function removeRow(button) {
      const row = button.closest("tr");
      const tbody = row.parentElement;
      row.remove();
      updateValues(tbody);
    }

    function updateValues(tbody) {
      const rows = tbody.querySelectorAll("tr");
      let minValue = Infinity;
      let bestRow = null;

      rows.forEach(row => {
        const price = parseFloat(row.cells[1].querySelector("input").value);
        const unit = parseFloat(row.cells[2].querySelector("input").value);
        const unitType = row.cells[3].querySelector("select").value;
        const valueCell = row.querySelector(".valueCell");

        let valueText = "-";
        if (!isNaN(price) && !isNaN(unit) && unit > 0) {
          const value = price / unit;
          valueText = `${value.toFixed(4)} / ${unitType}`;
          if (value < minValue) {
            minValue = value;
            bestRow = row;
          }
        }

        valueCell.textContent = valueText;
        row.classList.remove("best");
      });

      if (bestRow) bestRow.classList.add("best");
    }

    // Init first category by default
    addCategory();
  </script>
</body>
</html>
